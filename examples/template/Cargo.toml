[package]
name = "dw1000-template"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"

[dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
defmt = "0.3"
defmt-rtt = "0.4"
embedded-hal = "1.0.0"
embedded-hal-bus = "0.3"
panic-halt = "0.2"
stm32l4xx-hal = { version = "0.7.1", features = ["rt", "stm32l432"] }
dw1000-rs = { path = "../..", features = ["defmt"] }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
