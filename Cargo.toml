[package]
name = "dw1000-rs"
version = "0.1.0"
edition = "2021"
authors = ["Nicolas Farabegoli"]
license = "Apache-2.0"
description = "Embedded Rust driver for the Decawave DW1000 UWB transceiver"
repository = "https://github.com/nicolasfara/dw1000-rs"
keywords = ["embedded", "uwb", "dw1000", "driver", "no-std"]
categories = ["embedded", "hardware-support", "no-std"]

[dependencies]
embedded-hal = "1.0.0"
defmt = { version = "0.3", optional = true }
libm = "0.2"
heapless = "0.9.1"
rand_core = "0.9.3"

[dev-dependencies]
defmt = "0.3"
defmt-rtt = "0.4"
embassy-stm32 = { version = "0.1", features = ["stm32f103c8", "time-driver-any", "exti"] }
embassy-time = "0.3"
embassy-executor = { version = "0.5", features = ["arch-cortex-m", "executor-thread", "integrated-timers", "defmt"] }
embassy-embedded-hal = "0.1"
embedded-hal-bus = "0.2"
cortex-m = {  version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
panic-halt = "0.2"

[features]
default = []

[[example]]
name = "anchor"
required-features = []

[[example]]
name = "tag"
required-features = []

# Set the default for dependencies.
[profile.dev.package."*"]
opt-level = "s"

[profile.release]
codegen-units = 1
incremental = false
debug = true
lto = true
opt-level = "s"
